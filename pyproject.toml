[project]
name = "evidencia"
version = "0.1.0"
description = "Sistema de trazabilidad de evidencia: extrae afirmaciones verificables de un texto y las ancla a su cita literal."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
evidencia = "evidencia.cli:main"

# `eval/` es un directorio de datos, no un paquete: sin esto la
# autodetección de setuptools lo trata como tal y la instalación falla.
[tool.setuptools]
packages = ["evidencia"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
